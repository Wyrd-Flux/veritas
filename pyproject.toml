[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veritas-demo"
version = "0.2.0"
description = "Governed claim admission: can this claim be admitted, under what evidence, and what may be concluded from it."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Veritas contributors" }]
keywords = ["provenance", "evidence", "governance", "predicates", "capability-discovery"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Quality Assurance",
]

# No dependencies. The evidence primitives are folded into this package, so a
# clone is runnable on its own with nothing else installed.
dependencies = []

[project.scripts]
veritas-demo = "veritas_demo.cli:main"

[project.urls]
Homepage = "https://github.com/Wyrd-Flux/veritas"
Source = "https://github.com/Wyrd-Flux/veritas"

[tool.setuptools.packages.find]
include = ["veritas_demo*"]

[tool.setuptools.package-data]
veritas_demo = ["example_capability_registry.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
